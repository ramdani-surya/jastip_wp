name: ${PROJECT_NAME:-titip-cirebon}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Jakarta
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user="$${MYSQL_USER}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WORDPRESS_VERSION: "7.0.3"
        WORDPRESS_SHA1: 344b74d7cbf13c55ba0f12cad207c06cfee4368a
        WORDPRESS_SHA256: 38e4c7d79596d58f60fa5496a235471407c44dc37a6f9c4d31d46070985e8bc4
    image: ${PROJECT_NAME:-titip-cirebon}-wordpress:7.0.3-php8.4-fpm
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-development}
      WORDPRESS_URL: http://localhost:${WORDPRESS_PORT:-8080}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'development');
        define('WP_DEBUG_DISPLAY', WP_DEBUG);
        define('WP_DEBUG_LOG', false);
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_HOME', getenv('WORDPRESS_URL'));
        define('WP_SITEURL', getenv('WORDPRESS_URL'));
        define('FS_METHOD', 'direct');
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/php/conf.d/wordpress.ini:/usr/local/etc/php/conf.d/zz-titip-cirebon.ini:ro
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    depends_on:
      wordpress:
        condition: service_started

volumes:
  db_data:
  wordpress_data:

networks:
  app:
    driver: bridge
