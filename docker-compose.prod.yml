# Production override — digabungkan dengan compose.yaml:
#   docker compose -f compose.yaml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# File ini TIDAK berdiri sendiri. Ia hanya menimpa nilai-nilai tertentu
# dari compose.yaml untuk kebutuhan production.

name: ${PROJECT_NAME:-titip-cirebon}

services:
  wordpress:
    environment:
      WORDPRESS_DEBUG: "false"
      WP_ENVIRONMENT_TYPE: production
      WORDPRESS_URL: ${WORDPRESS_PROTOCOL:-http}://${WORDPRESS_DOMAIN:?Set WORDPRESS_DOMAIN in .env.prod}
      WORDPRESS_CONFIG_EXTRA: |
        if (!defined('WP_ENVIRONMENT_TYPE')) define('WP_ENVIRONMENT_TYPE', 'production');
        if (!defined('WP_DEBUG')) define('WP_DEBUG', false);
        if (!defined('WP_DEBUG_DISPLAY')) define('WP_DEBUG_DISPLAY', false);
        if (!defined('WP_DEBUG_LOG')) define('WP_DEBUG_LOG', false);
        if (!defined('WP_MEMORY_LIMIT')) define('WP_MEMORY_LIMIT', '512M');
        if (!defined('WP_MAX_MEMORY_LIMIT')) define('WP_MAX_MEMORY_LIMIT', '512M');
        if (!defined('WP_AUTO_UPDATE_CORE')) define('WP_AUTO_UPDATE_CORE', false);
        if (!defined('WP_HOME')) define('WP_HOME', getenv('WORDPRESS_URL'));
        if (!defined('WP_SITEURL')) define('WP_SITEURL', getenv('WORDPRESS_URL'));
        if (!defined('FS_METHOD')) define('FS_METHOD', 'direct');
        if (!defined('DISALLOW_FILE_EDIT')) define('DISALLOW_FILE_EDIT', true);
        if (!defined('DISALLOW_FILE_MODS')) define('DISALLOW_FILE_MODS', false);
        if (!defined('DISABLE_WP_CRON')) define('DISABLE_WP_CRON', true);
        // Aktifkan wp-cron via sistem cron di server:
        // */5 * * * * curl -s "http://YOUR_DOMAIN/wp-cron.php?doing_wp_cron" > /dev/null 2>&1
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/php/conf.d/wordpress.ini:/usr/local/etc/php/conf.d/zz-titip-cirebon.ini:ro
      - ./docker/php/conf.d/wordpress.prod.ini:/usr/local/etc/php/conf.d/zz-titip-cirebon-prod.ini:ro
      - ./wordpress/wp-content/plugins/titip-cirebon-core:/var/www/html/wp-content/plugins/titip-cirebon-core

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ${NGINX_CONF_FILE:-./docker/nginx/conf.d/default.prod.http.conf}:/etc/nginx/conf.d/default.conf:ro
      # Sertifikat SSL dari panel hosting (cPanel/Niagahoster/dsb):
      # Salin file .crt dan .key ke ./docker/nginx/certs/ sebelum menjalankan prod-up.
      # Struktur yang diharapkan:
      #   docker/nginx/certs/fullchain.crt
      #   docker/nginx/certs/privkey.key
      - ./docker/nginx/certs:/etc/nginx/certs:ro
