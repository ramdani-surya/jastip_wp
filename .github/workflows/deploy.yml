name: CD Continuous Deployment

on:
  push:
    branches:
      - production
      - staging
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_backup:
        description: 'Skip Pre-Deploy Backup? (NOT recommended)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.select.outputs.env }}
      target_branch: ${{ steps.select.outputs.branch }}
    steps:
      - id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "production" ]; then
            SELECTED_ENV="production"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            SELECTED_ENV="staging"
          else
            SELECTED_ENV="staging"
          fi

          echo "env=$SELECTED_ENV" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "Deploying to environment: $SELECTED_ENV on branch: ${{ github.ref_name }}"

  deploy:
    name: Deploy to Server
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.target_env }}
    steps:
      - name: Prepare Environment Secret
        id: prep-env
        env:
          RAW_ENV: ${{ secrets.ENV_FILE || '' }}
        run: |
          if [ -n "$RAW_ENV" ]; then
            B64=$(printf "%s" "$RAW_ENV" | base64 -w 0)
            echo "env_b64=$B64" >> $GITHUB_OUTPUT
            echo "Environment secret detected and encoded."
          else
            echo "env_b64=" >> $GITHUB_OUTPUT
            echo "No ENV_FILE secret provided; falling back to server local environment."
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_ENV: ${{ needs.determine-env.outputs.target_env }}
          TARGET_BRANCH: ${{ needs.determine-env.outputs.target_branch }}
          SKIP_BACKUP: ${{ github.event.inputs.skip_backup || 'false' }}
          DOMAIN: ${{ vars.WORDPRESS_DOMAIN || '' }}
          ENV_B64: ${{ steps.prep-env.outputs.env_b64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TARGET_ENV,TARGET_BRANCH,SKIP_BACKUP,DOMAIN,ENV_B64
          script_stop: true
          script: |
            cat << 'BASH_EOF' > /tmp/agy_deploy.sh
            set -e
            echo "==========================================================="
            echo "🚀 Memulai Deployment ke [ $TARGET_ENV ] (Branch: $TARGET_BRANCH)"
            echo "==========================================================="

            # 1. Masuk ke direktori aplikasi
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/titip-cirebon' }}"
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "ERROR: Direktori $DEPLOY_PATH tidak ditemukan di server!"
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # 2. Injeksi Environment dari GitHub Secret (Ephemeral - otomatis dihapus saat deploy selesai)
            TARGET_ENV_FILE=".env.prod"
            if [ "$TARGET_ENV" != "production" ]; then
              TARGET_ENV_FILE=".env"
            fi

            if [ -n "$ENV_B64" ]; then
              echo "[deploy] Memuat variabel environment dari GitHub Secrets..."
              trap "rm -f $TARGET_ENV_FILE" EXIT INT TERM
              if printf "%s" "$ENV_B64" | tr -d '\r\n ' | (base64 -di 2>/dev/null || base64 -d) > "$TARGET_ENV_FILE" 2>/tmp/b64.err; then
                chmod 600 "$TARGET_ENV_FILE"
                echo "[deploy] File environment $TARGET_ENV_FILE berhasil dimuat (file sementara berhak akses 600, akan otomatis dihapus saat deploy selesai)."
              else
                echo "ERROR: Gagal men-decode Base64 dari ENV_FILE secret! Detail error:" >&2
                cat /tmp/b64.err >&2
                exit 1
              fi
            fi

            # 3. Snapshot Backup Otomatis sebelum update (Zero-Loss Guarantee)
            if [ "$SKIP_BACKUP" != "true" ] && [ -f "./scripts/backup.sh" ]; then
              echo "[deploy] Membuat snapshot database pra-deploy..."
              ./scripts/backup.sh < /dev/null || echo "[deploy] Warning: Backup script exited with code $?"
            fi

            # 4. Sinkronisasi Git Repository
            echo "[deploy] Menarik commit terbaru dari branch $TARGET_BRANCH..."
            git fetch origin
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"

            # 5. Build dan Reload Docker Containers
            echo "[deploy] Mereload Docker containers..."
            if [ "$TARGET_ENV" = "production" ]; then
              make prod-up
            else
              if [ -f .env ]; then
                docker compose --env-file .env up -d --build
              else
                docker compose up -d --build
              fi
            fi

            # Tentukan perintah docker compose yang menyertakan file environment
            COMPOSE_CMD="docker compose"
            if [ -f "$TARGET_ENV_FILE" ]; then
              if [ "$TARGET_ENV" = "production" ]; then
                COMPOSE_CMD="docker compose -f compose.yaml -f docker-compose.prod.yml --env-file $TARGET_ENV_FILE"
              else
                COMPOSE_CMD="docker compose --env-file $TARGET_ENV_FILE"
              fi
            fi

            # 5b. Automated Day-0 Baseline Seeding (Idempotent)
            echo "[deploy] Memeriksa status instalasi database WordPress..."
            TABLE_EXISTS=$($COMPOSE_CMD exec -T db sh -c \
              'MYSQL_PWD="$MYSQL_PASSWORD" mysql -N -s --user="$MYSQL_USER" "$MYSQL_DATABASE" -e "SHOW TABLES LIKE '\''wp_options'\'';"' < /dev/null 2>/dev/null || echo "")

            if [ -z "$TABLE_EXISTS" ]; then
              echo "[deploy] Database kosong terdeteksi (Day-0). Memulai inisialisasi baseline seed..."

              # 1. Impor baseline SQL terkompresi langsung ke container db
              if [ -f "database/seed.sql.gz" ]; then
                echo "[deploy] Mengimpor database/seed.sql.gz..."
                gunzip -c database/seed.sql.gz | $COMPOSE_CMD exec -T db sh -c \
                  'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user="$MYSQL_USER" "$MYSQL_DATABASE"'
                echo "[deploy] Baseline SQL berhasil diimpor."
              fi

              # 2. Ekstrak media uploads awal
              if [ -f "database/uploads-seed.tar.gz" ]; then
                echo "[deploy] Mengekstrak media awal ke wp-content/uploads..."
                $COMPOSE_CMD exec -T wordpress tar --extract --gzip --directory /var/www/html/wp-content < database/uploads-seed.tar.gz
                $COMPOSE_CMD exec -T wordpress chown -R www-data:www-data /var/www/html/wp-content/uploads
                echo "[deploy] Media uploads berhasil diekstrak."
              fi

              # 3. Sinkronkan domain dan serialisasi JSON/PHP ke URL target
              echo "[deploy] Menjalankan penyelarasan domain (sync-domain.php)..."
              $COMPOSE_CMD exec -T wordpress php < docker/php/sync-domain.php < /dev/null

              # 4. Sinkronkan akun Administrator jika variabel diset
              if [ -f "$TARGET_ENV_FILE" ]; then
                set -a
                # shellcheck source=/dev/null
                . "$TARGET_ENV_FILE"
                set +a
              fi

              if [ -n "${WP_ADMIN_USER:-}" ] && [ -n "${WP_ADMIN_PASSWORD:-}" ]; then
                echo "[deploy] Menyinkronkan akun administrator '$WP_ADMIN_USER'..."
                $COMPOSE_CMD exec -T \
                  -e WP_ADMIN_USER="$WP_ADMIN_USER" \
                  -e WP_ADMIN_PASSWORD="$WP_ADMIN_PASSWORD" \
                  -e WP_ADMIN_EMAIL="${WP_ADMIN_EMAIL:-admin@titipcirebon.com}" \
                  wordpress php -r '
                    require "/var/www/html/wp-load.php";
                    $u = getenv("WP_ADMIN_USER");
                    $p = getenv("WP_ADMIN_PASSWORD");
                    $e = getenv("WP_ADMIN_EMAIL");
                    $admin = get_user_by("login", $u);
                    if ($admin) {
                      wp_set_password($p, $admin->ID);
                      wp_update_user(["ID" => $admin->ID, "user_email" => $e]);
                      echo "[deploy] Kredensial administrator diperbarui.\n";
                    } else {
                      $uid = wp_create_user($u, $p, $e);
                      if (!is_wp_error($uid)) {
                        $user = new WP_User((int) $uid);
                        $user->set_role("administrator");
                        echo "[deploy] Akun administrator dibuat.\n";
                      }
                    }
                  ' < /dev/null || echo "[deploy] Warning: Admin sync encountered an issue."
              fi
            else
              echo "[deploy] Database WordPress sudah terinstal (terdapat tabel wp_options). Seeding dilewati."
            fi

            # 6. Post-Deploy: Flush Rewrite Rules, Reset OPcache & Elementor CSS Cache
            echo "[deploy] Membersihkan cache aplikasi & permalinks..."
            $COMPOSE_CMD exec -T wordpress php -r '
              require "/var/www/html/wp-load.php";
              flush_rewrite_rules(false);
              if (function_exists("opcache_reset")) { opcache_reset(); }
              if (class_exists("\Elementor\Plugin")) {
                \Elementor\Plugin::$instance->files_manager->clear_cache();
              }
              echo "[deploy] Permalinks and Elementor cache refreshed successfully.\n";
            ' || echo "[deploy] Warning: Cache flush encountered an issue."

            # 7. Automated Health Check (Support HTTPS & HTTP Fallback)
            if [ -n "$DOMAIN" ]; then
              CLEAN_DOMAIN=$(echo "$DOMAIN" | sed -E 's|^https?://||' | sed -E 's|/.*$||')
              echo "[deploy] Menjalankan automated health check ke $CLEAN_DOMAIN..."
              HEALTHY=false
              SUCCESS_STATUS=""
              SUCCESS_PROTO=""

              for i in 1 2 3 4 5 6; do
                # 1. Coba HTTPS terlebih dahulu (dengan toleransi sertifikat self-signed -k)
                STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://$CLEAN_DOMAIN" || true)
                USED_PROTO="https"

                # 2. Jika HTTPS tidak merespons (status 000 / connection refused / SSL error), fallback ke HTTP
                if [ "$STATUS" = "000" ] || [ -z "$STATUS" ]; then
                  FALLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "http://$CLEAN_DOMAIN" || true)
                  if [ "$FALLBACK_STATUS" != "000" ] && [ -n "$FALLBACK_STATUS" ]; then
                    STATUS="$FALLBACK_STATUS"
                    USED_PROTO="http"
                  fi
                fi

                echo "[deploy] Check #$i via $USED_PROTO: HTTP status $STATUS"
                if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
                  HEALTHY=true
                  SUCCESS_STATUS="$STATUS"
                  SUCCESS_PROTO="$USED_PROTO"
                  break
                fi
                sleep 5
              done

              if [ "$HEALTHY" = "true" ]; then
                echo "✅ Health check BERHASIL: Website merespons status $SUCCESS_STATUS via $SUCCESS_PROTO"
              else
                echo "❌ Health check GAGAL: Website tidak merespons status 200/301/302 pada https://$CLEAN_DOMAIN maupun http://$CLEAN_DOMAIN."
                exit 1
              fi
            fi

            echo "==========================================================="
            echo "🎉 Deployment ke [ $TARGET_ENV ] BERHASIL!"
            echo "==========================================================="
            BASH_EOF
            /bin/bash -e /tmp/agy_deploy.sh
            rm -f /tmp/agy_deploy.sh
