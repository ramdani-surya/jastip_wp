; =============================================================================
; PHP Production Overrides — Titip Cirebon
; =============================================================================
; File ini di-load SETELAH wordpress.ini (prefix zz-titip-cirebon-prod)
; sehingga hanya nilai di bawah ini yang ditimpa untuk production.
; Nilai lain (memory_limit, upload_max_filesize, dll) tetap dari wordpress.ini.
; =============================================================================

; Sembunyikan semua error dari output publik — wajib untuk production
display_errors         = Off
display_startup_errors = Off

; Log error tetap aktif (ke stderr → Docker logs)
log_errors = On

; OPcache: nonaktifkan pengecekan timestamp setiap request
; Di production file PHP tidak berubah sewaktu-waktu, jadi ini aman
; dan memberikan performa yang lebih baik.
opcache.validate_timestamps = 0
