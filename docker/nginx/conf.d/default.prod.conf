# =============================================================================
# Nginx Production Configuration — Titip Cirebon (Default: HTTP / Non-SSL Mode)
# =============================================================================
# Konfigurasi ini secara default melayani traffic HTTP pada port 80 (cocok untuk
# IP VPS langsung seperti http://103.93.134.96/ tanpa sertifikat SSL).
#
# Untuk mengaktifkan mode SSL/HTTPS saat domain sudah siap:
# 1. Masukkan sertifikat ke docker/nginx/certs/fullchain.crt dan privkey.key
# 2. Set NGINX_CONF_FILE=./docker/nginx/conf.d/default.prod.ssl.conf di .env.prod
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;
    absolute_redirect off;

    # -------------------------------------------------------------------------
    # Security Headers (HTTP Compatible — no HSTS)
    # -------------------------------------------------------------------------
    add_header X-Frame-Options             "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options      "nosniff"                                 always;
    add_header X-XSS-Protection            "1; mode=block"                           always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

    # -------------------------------------------------------------------------
    # WordPress Routing
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Trailing slash redirect untuk wp-admin
    location = /wp-admin {
        return 301 /wp-admin/;
    }

    # -------------------------------------------------------------------------
    # Security Rules
    # -------------------------------------------------------------------------

    # Blokir eksekusi PHP di folder uploads (cegah webshell)
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Blokir akses langsung ke wp-config.php
    location = /wp-config.php {
        deny all;
    }

    # Blokir xmlrpc.php (target umum serangan brute-force & DDoS amplification)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir file dan folder tersembunyi (.git, .env, .htaccess, dsb.)
    location ~ /\. {
        deny all;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM Handler
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass              wordpress:9000;
        fastcgi_index             index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY  "";
        fastcgi_read_timeout      120s;
    }

    # -------------------------------------------------------------------------
    # Static Assets — Cache Agresif
    # -------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$args;
    }
}
