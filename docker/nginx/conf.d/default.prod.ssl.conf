# =============================================================================
# Nginx Production SSL Configuration — Titip Cirebon (Domain & HTTPS Mode)
# =============================================================================
# Gunakan file konfigurasi ini jika domain dan sertifikat SSL sudah terpasang.
# 1. Salin sertifikat SSL ke:
#      docker/nginx/certs/fullchain.crt   (sertifikat + chain)
#      docker/nginx/certs/privkey.key     (private key)
# 2. Atur di .env.prod:
#      WORDPRESS_PROTOCOL=https
#      WORDPRESS_DOMAIN=namadomainanda.com
#      NGINX_CONF_FILE=./docker/nginx/conf.d/default.prod.ssl.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Block 1: HTTP → HTTPS redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect semua traffic HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# Block 2: HTTPS — WordPress production
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # -------------------------------------------------------------------------
    # SSL — Sertifikat dari panel hosting atau Certbot
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    # Hanya izinkan TLS modern (nonaktifkan TLS 1.0 dan 1.1)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options             "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options      "nosniff"                                 always;
    add_header X-XSS-Protection            "1; mode=block"                           always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

    root  /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;
    absolute_redirect off;

    # -------------------------------------------------------------------------
    # WordPress Routing
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Trailing slash redirect untuk wp-admin
    location = /wp-admin {
        return 301 /wp-admin/;
    }

    # -------------------------------------------------------------------------
    # Security Rules
    # -------------------------------------------------------------------------

    # Blokir eksekusi PHP di folder uploads (cegah webshell)
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Blokir akses langsung ke wp-config.php
    location = /wp-config.php {
        deny all;
    }

    # Blokir xmlrpc.php (target umum serangan brute-force & DDoS amplification)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir file dan folder tersembunyi (.git, .env, .htaccess, dsb.)
    location ~ /\. {
        deny all;
    }

    # -------------------------------------------------------------------------
    # PHP-FPM Handler
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass              wordpress:9000;
        fastcgi_index             index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY  "";
        fastcgi_param HTTPS       on;
        fastcgi_read_timeout      120s;
    }

    # -------------------------------------------------------------------------
    # Static Assets — Cache Agresif
    # -------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$args;
    }
}
